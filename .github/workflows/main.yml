name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        run: |
          rm -rf android-project
          mkdir android-project
          unzip -q DigitalAbsensiGprojectapp_GitHub_1Klik_BuildAPK.zip -d android-project

      - name: Find project
        run: |
          echo "Isi project:"
          find android-project -maxdepth 3 -type f | head -100

      - name: Build APK
        run: |
          PROJECT_DIR=$(find android-project -name settings.gradle -o -name settings.gradle.kts | head -n 1 | xargs dirname)
          echo "Project ditemukan di: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DigitalAbsensiGprojectapp-APK
          path: |
            android-project/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
